<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportFit — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding-top: 72px; min-height: 100vh; display: flex; flex-direction: column; }

    .dashboard-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .hero-title {
      font-size: clamp(32px, 5vw, 64px);
      margin-bottom: 16px;
    }

    .hero-subtitle {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 48px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      max-width: 900px;
      width: 100%;
    }

    .dash-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 24px;
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      transition: all var(--trans-fast);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .dash-btn:hover {
      border-color: var(--blue-primary);
      background: rgba(13,110,253,0.05);
      transform: translateY(-4px);
    }

    .dash-icon {
      font-size: 32px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="home.html" class="nav-logo"><span>🏃 SPORT<span class="logo-accent">FIT</span></span></a>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="sports.html">Sports</a></li>
      <li><a href="fitness.html">Fitness</a></li>
      <li><a href="workouts.html">Workouts</a></li>
      <li><a href="nutrition.html">Nutrition</a></li>
      <li><a href="progress.html">Progress</a></li>
    </ul>
    <div class="nav-actions">
      <!-- These disappear when logged in, handled by auth.js -->
      <a href="login.html" class="btn btn-ghost btn-sm" id="nav-login-btn">Login</a>
      <a href="register.html" class="btn btn-primary btn-sm" id="nav-signup-btn">Get Started</a>
      
      <!-- User Menu placeholder for auth.js to reveal if needed (Optional) -->
      <div id="nav-user-menu" style="display:none; align-items:center; gap:10px;">
        <span id="nav-user-label" style="font-size:14px; font-weight:600;"></span>
        <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>

  <!-- SIMPLE DASHBOARD CONTENT -->
  <div class="dashboard-container">
    <h1 class="hero-title reveal">🏃 SPORT<span class="logo-accent">FIT</span></h1>
    <p class="hero-subtitle reveal">Train • Track • Transform</p>

    <div class="dashboard-grid reveal reveal-delay-1">
      <a href="sports.html" class="dash-btn">
        <span class="dash-icon">🏏</span> Sports
      </a>
      <a href="fitness.html" class="dash-btn">
        <span class="dash-icon">🧘‍♂️</span> Fitness
      </a>
      <a href="workouts.html" class="dash-btn">
        <span class="dash-icon">🏋️</span> Workouts
      </a>
      <a href="nutrition.html" class="dash-btn">
        <span class="dash-icon">🍎</span> Nutrition
      </a>
      <a href="progress.html" class="dash-btn">
        <span class="dash-icon">📊</span> Progress
      </a>
      <a href="aiformguard.html" class="dash-btn">
        <span class="dash-icon">🤖</span> AI Form Guard
      </a>
      <a href="Accessibility.html" class="dash-btn">
        <span class="dash-icon">♿</span> Voice Assistant
      </a>
      <a href="AI_voice_coach.html" class="dash-btn">
        <span class="dash-icon">🎤</span> Voice Coach
      </a>
      <a href="fatigue.html" class="dash-btn">
        <span class="dash-icon">😴</span> Fatigue Detect
      </a>
      <a href="ar_campus.html" class="dash-btn">
        <span class="dash-icon">🎮</span> AR Quests
      </a>
      <a href="PW Care.html" class="dash-btn">
        <span class="dash-icon">🤝</span> PW Care
      </a>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { bindNavAuthState, logout } from './js/auth.js';
    initApp();
    bindNavAuthState();
    
    // Wire up logout button if present
    const outBtn = document.getElementById('logout-btn');
    if(outBtn) {
      outBtn.addEventListener('click', async () => {
        await logout();
        window.location.reload();
      });
    }
  </script>
</body>
</html>
