<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fatigue Detection — SportFit</title>
  <meta name="description" content="Monitor your fatigue level during workout.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding-top: 72px; }

    .page-hero {
      text-align: center;
      padding: 80px 20px 40px;
    }

    .page-hero h1 { font-size: clamp(32px, 4vw, 48px); margin-bottom: 12px; }
    .page-hero p { color: var(--text-muted); font-size: 16px; max-width: 600px; margin: 0 auto; }

    .content-section { padding: 40px 0 80px; display: flex; justify-content: center; align-items: center; min-height: 60vh; }

    .fatigue-container {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 48px 32px;
      text-align: center;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow-card);
    }

    .progress-container {
      width: 100%;
      height: 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      overflow: hidden;
      margin: 32px 0 16px;
    }

    .progress-bar {
      width: 20%;
      height: 100%;
      background: var(--green-accent);
      transition: width 0.5s ease, background 0.5s ease;
    }

    #fatigueValue {
      font-size: 48px;
      font-weight: 800;
      color: var(--text-primary);
      font-family: var(--font-heading);
      margin-bottom: 32px;
    }

    .status-display {
      margin-top: 24px;
      padding: 16px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-card);
      font-size: 16px;
      font-weight: 500;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

  </style>
</head>
<body>

  <nav class="navbar">
    <a href="home.html" class="nav-logo"><span>🏃 SPORT<span class="logo-accent">FIT</span></span></a>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="sports.html">Sports</a></li>
      <li><a href="fitness.html">Fitness</a></li>
      <li><a href="workouts.html">Workouts</a></li>
      <li><a href="nutrition.html">Nutrition</a></li>
      <li><a href="progress.html">Progress</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-ghost btn-sm" id="nav-login-btn">Login</a>
      <a href="register.html" class="btn btn-primary btn-sm" id="nav-signup-btn">Get Started</a>
    </div>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>

  <section class="content-section">
    <div class="container" style="display:flex; justify-content:center;">
      <div class="fatigue-container reveal">
        <span class="section-tag" style="margin-bottom:16px;">AI Feature</span>
        <h1>Fatigue <span class="gradient-text">Detection</span></h1>
        <p style="color:var(--text-muted); margin-bottom:24px;">Simulate monitoring your fatigue level during workout.</p>
        
        <div class="progress-container">
          <div class="progress-bar" id="fatigueBar"></div>
        </div>

        <div id="fatigueValue">20%</div>

        <button class="btn btn-primary" onclick="increaseFatigue()" style="width:100%; justify-content:center;">
          Simulate Workout Effort
        </button>
        
        <button class="btn btn-ghost btn-sm" onclick="resetFatigue()" style="margin-top: 10px;">
          Reset
        </button>

        <div class="status-display" id="status" style="color:var(--green-accent);">
          💪 Energy Level Good
        </div>
      </div>
    </div>
  </section>

  <div style="text-align:center; padding-bottom:60px;">
    <a href="home.html" class="btn btn-ghost">← Back To Home</a>
  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { bindNavAuthState } from './js/auth.js';
    initApp();
    bindNavAuthState();
  </script>

  <script>
    let fatigue = 20;

    window.resetFatigue = function() {
        fatigue = 20;
        updateUI();
    }

    window.increaseFatigue = function(){
        fatigue += 20;
        if(fatigue > 100) fatigue = 100;
        updateUI();

        if(fatigue >= 100){
            let voice = new SpeechSynthesisUtterance("Warning. You are tired. Please take some rest.");
            speechSynthesis.speak(voice);
        }
    }

    function updateUI() {
        const bar = document.getElementById("fatigueBar");
        const val = document.getElementById("fatigueValue");
        const status = document.getElementById("status");

        bar.style.width = fatigue + "%";
        val.innerHTML = fatigue + "%";

        if(fatigue < 50){
            bar.style.background = "var(--green-accent)";
            status.innerHTML = "💪 Energy Level Good";
            status.style.color = "var(--green-accent)";
        }
        else if(fatigue < 80){
            bar.style.background = "#fbbf24"; // warning orange/yellow
            status.innerHTML = "⚠ Drink Water & Take Short Break";
            status.style.color = "#fbbf24";
        }
        else{
            bar.style.background = "#ef4444"; // red
            status.innerHTML = "🚨 Rest Recommended";
            status.style.color = "#ef4444";
        }
    }
  </script>
</body>
</html>
