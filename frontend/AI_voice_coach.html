<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Coach — SportFit</title>
  <meta name="description" content="Your personal fitness voice assistant.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding-top: 72px; }

    .page-hero {
      text-align: center;
      padding: 80px 20px 40px;
    }

    .page-hero h1 { font-size: clamp(32px, 4vw, 48px); margin-bottom: 12px; }
    .page-hero p { color: var(--text-muted); font-size: 16px; max-width: 600px; margin: 0 auto; }

    .content-section { padding: 40px 0 80px; display: flex; justify-content: center; align-items: center; min-height: 60vh; }

    .coach-container {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 48px 32px;
      text-align: center;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow-card);
    }

    .mic-icon {
      font-size: 64px;
      margin-bottom: 24px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 32px;
    }

    .status-display {
      margin-top: 32px;
      padding: 16px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-card);
      color: var(--blue-light);
      font-weight: 600;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="home.html" class="nav-logo"><span>🏃 SPORT<span class="logo-accent">FIT</span></span></a>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="sports.html">Sports</a></li>
      <li><a href="fitness.html">Fitness</a></li>
      <li><a href="workouts.html">Workouts</a></li>
      <li><a href="nutrition.html">Nutrition</a></li>
      <li><a href="progress.html">Progress</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-ghost btn-sm" id="nav-login-btn">Login</a>
      <a href="register.html" class="btn btn-primary btn-sm" id="nav-signup-btn">Get Started</a>
    </div>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>

  <section class="content-section">
    <div class="container" style="display:flex; justify-content:center;">
      <div class="coach-container reveal">
        <span class="section-tag" style="margin-bottom:16px;">AI Feature</span>
        <h1>Voice <span class="gradient-text">Coach</span></h1>
        <p style="color:var(--text-muted); margin-bottom:24px;">Your personal fitness voice assistant.</p>
        
        <div class="mic-icon">🎤</div>

        <div class="btn-group">
          <button class="btn btn-primary" onclick="startCoach()">Start Coaching</button>
          <button class="btn btn-outline" onclick="motivateMe()">Motivate Me</button>
          <button class="btn btn-ghost" onclick="stopCoach()">Stop Voice</button>
        </div>

        <div class="status-display" id="status">
          Coach Ready
        </div>
      </div>
    </div>
  </section>

  <div style="text-align:center; padding-bottom:60px;">
    <a href="home.html" class="btn btn-ghost">← Back To Home</a>
  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { bindNavAuthState } from './js/auth.js';
    initApp();
    bindNavAuthState();
  </script>

  <script>
    let speech;

    function speak(text){
        speech = new SpeechSynthesisUtterance(text);
        speech.rate = 1;
        speech.pitch = 1;
        speech.volume = 1;
        speechSynthesis.speak(speech);
    }

    window.startCoach = function(){
        document.getElementById("status").innerHTML = "🏋️ Workout Coaching Started";
        document.getElementById("status").style.color = "var(--green-accent)";
        speak("Welcome to SportFit. Start with a warm up. Keep your posture straight and breathe properly during exercise.");
    }

    window.motivateMe = function(){
        const messages = [
            "You are stronger than you think.",
            "Every workout makes you better.",
            "Stay focused and keep moving.",
            "Success starts with consistency.",
            "Believe in yourself and keep going."
        ];
        let random = messages[Math.floor(Math.random()*messages.length)];
        document.getElementById("status").innerHTML = "🔥 Motivation Activated";
        document.getElementById("status").style.color = "var(--text-primary)";
        speak(random);
    }

    window.stopCoach = function(){
        speechSynthesis.cancel();
        document.getElementById("status").innerHTML = "🔇 Voice Coach Stopped";
        document.getElementById("status").style.color = "var(--text-muted)";
    }
  </script>
</body>
</html>
